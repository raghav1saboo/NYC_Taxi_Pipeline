name: dbt_Continuous_Integration

on:
  push:
    branches: [ main ]  # Runs every time you push to main
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./taxi_transformation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dbt
        run: |
          pip install dbt-snowflake
	
      - name: Final Path Debugger
        run: |
          echo "Working Directory: $(pwd)"
          echo "Listing all dbt files in the repo:"
          find . -name "dbt_project.yml"

      - name: Run dbt Build (Dev Environment)
        env:
          # This maps the GitHub Secret to an Environment Variable
          DBT_ENV_SECRET_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
        run: |
          # We run build against 'dev' to ensure the new code doesn't break anything
          # dbt will use the Env Var for the password in your profiles.yml
          dbt deps --project-dir $GITHUB_WORKSPACE/taxi_transformation
          dbt build --project-dir $GITHUB_WORKSPACE/taxi_transformation --profiles-dir $GITHUB_WORKSPACE/taxi_transformation --target dev
